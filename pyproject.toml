[project]
name = "ohpg"
version = "2.0.0"
description = "Générateur de profils OpenHoldem (OpenPPL) : ranges, stratégie mixte, push/fold, validation des symboles"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6"]
dev = ["pytest", "eval7"]

[project.scripts]
ohpg = "ohpg.cli:main"

[tool.setuptools.packages.find]
include = ["ohpg*"]

[tool.setuptools.package-data]
ohpg = ["data/*.txt"]
